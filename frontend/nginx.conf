# =============================================================================
# NyayaSahay Frontend - Nginx Configuration
# SPA routing + reverse proxy to FastAPI backend
# =============================================================================

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;  # Mitigate BREACH attack on small responses
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml+rss application/atom+xml image/svg+xml;

server {
    listen 80;
    server_name law-gpt.app;  # SECURITY: Explicit hostname prevents host header injection
    server_tokens off;        # SECURITY: Hide nginx version in headers/error pages

    # Allow file uploads up to 15 MB (backend limit is 10 MB)
    client_max_body_size 15m;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # NOTE: X-XSS-Protection intentionally omitted — deprecated, CSP is superior
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS — force HTTPS for 1 year, include subdomains, allow preload list
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Restrict browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Cross-Origin Resource Policy
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # -------------------------------------------------------------------------
    # Health check proxy → backend container
    # -------------------------------------------------------------------------
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # API reverse proxy → backend container
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        # SSE streaming support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running LLM requests
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # -------------------------------------------------------------------------
    # Nginx health ping (for Docker HEALTHCHECK)
    # -------------------------------------------------------------------------
    location = /health-ping {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;

        # IMPORTANT: Redeclare security headers — Nginx drops server-level
        # add_header directives when a location block defines its own.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # -------------------------------------------------------------------------
    # Static assets — long cache
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # IMPORTANT: Redeclare ALL security headers — Nginx drops server-level
        # add_header directives when a location block defines its own.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # -------------------------------------------------------------------------
    # SPA fallback — serve index.html for all non-file routes
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
