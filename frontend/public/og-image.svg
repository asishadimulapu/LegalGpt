    <rect x="55" y="67" width="10" height="30" fill="url(#accent)"/>
    <rect x="30" y="97" width="60" height="8" rx="4" fill="url(#accent)"/>
  </g>
  
  <!-- Main Title -->
  <text x="220" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="white">LawGPT</text>
  
  <!-- Subtitle -->
