# =============================================================================
# LawGPT - Docker Compose
# Backend (FastAPI) + Frontend (Nginx) + Redis
# =============================================================================
# Usage:
#   docker compose up -d            # Start all services
#   docker compose up -d --build    # Rebuild and start
#   docker compose logs -f backend  # Follow backend logs
#   docker compose down             # Stop all services
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI + RAG Pipeline
  # ---------------------------------------------------------------------------
  backend:
    image: ghcr.io/asishadimulapu/legalgpt/backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lawgpt-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      # Mount FAISS index data (persist across container restarts)
      - ./data/faiss_index:/app/data/faiss_index:ro
      # Mount logs directory for persistence
      - backend-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    # SECURITY: Container hardening
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
    networks:
      - lawgpt-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # ---------------------------------------------------------------------------
  # Frontend — Nginx serving React + reverse proxy to backend
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/asishadimulapu/legalgpt/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lawgpt-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    # SECURITY: Container hardening
    security_opt:
      - "no-new-privileges:true"
    read_only: true  # SECURITY: Read-only filesystem for static content
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - lawgpt-net
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost/health-ping" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Redis — session cache and rate limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    pull_policy: always
    container_name: lawgpt-redis
    restart: unless-stopped
    # SECURITY: No ports exposed — Redis is only accessible within lawgpt-net
    # SECURITY: Container hardening
    security_opt:
      - "no-new-privileges:true"
    environment:
      # Use env variable rather than inline parameter for secure healthchecking
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    volumes:
      - redis-data:/data
    networks:
      - lawgpt-net
    healthcheck:
      # SECURITY: Use REDISCLI_AUTH env var for authenticated healthcheck
      test: [ "CMD", "redis-cli", "--no-auth-warning", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    # SECURITY: Password authentication + memory limits
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    driver: local
  backend-logs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  lawgpt-net:
    driver: bridge
