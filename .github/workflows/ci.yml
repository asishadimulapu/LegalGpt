# =============================================================================
# CI Pipeline - NyayaSahay (LegalGpt)
# Runs on every push and pull request (tests + build + security)
# CD is handled separately by deploy.yml
# =============================================================================

name: CI - Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# SECURITY: Restrict default permissions (principle of least privilege)
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "18"

jobs:
  # ---------------------------------------------------------------------------
  # Backend Tests
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      # Dummy env vars so imports don't crash in CI
      DATABASE_URL: "sqlite:///./test.db"
      JWT_SECRET_KEY: "ci-test-secret-key-not-real"
      ENCRYPTION_KEY: "ci-test-encryption-key-1234567890abcdef"
      GROQ_API_KEY: "ci-test-groq-key"
      ENVIRONMENT: "testing"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run linting
        run: |
          pip install flake8
          # Stop build if there are syntax errors or undefined names
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings (non-blocking)
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check imports
        continue-on-error: true
        run: |
          python -c "from app.config import settings; print('✓ Config imports OK')" || echo "⚠ Config import failed (expected in CI)"
          python -c "from app.core.prompts import RAG_SYSTEM_PROMPT; print('✓ Prompts import OK')" || echo "⚠ Prompts import failed"
          python -c "from app.schemas.chat import LegalSource; print('✓ Schemas import OK')" || echo "⚠ Schemas import failed"

  # ---------------------------------------------------------------------------
  # Frontend Build
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          test -f dist/index.html && echo "✓ index.html exists"
          test -d dist/assets && echo "✓ assets directory exists"
          echo "Build size:"
          du -sh dist/

  # ---------------------------------------------------------------------------
  # Security Scanning (Enhanced)
  # ---------------------------------------------------------------------------
  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///./test.db"
      JWT_SECRET_KEY: "ci-test-secret-key-not-real"
      ENCRYPTION_KEY: "ci-test-encryption-key-1234567890abcdef"
      GROQ_API_KEY: "ci-test-groq-key"
      ENVIRONMENT: "testing"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Secrets Detection ──────────────────────────────────────────
      - name: Check for secrets in code
        run: |
          echo "Scanning for exposed secrets..."
          # Patterns match real API keys (long alphanumeric strings), not CSS classes like sk-mt8
          ! grep -rEn "GOCSPX-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[A-Z0-9]{16}|ghp_[A-Za-z0-9]{36}|glpat-[A-Za-z0-9_-]{20,}" \
            --include="*.py" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=venv --exclude-dir=__pycache__ \
            app/ frontend/src/ || { echo "❌ Potential secrets found!"; exit 1; }

      - name: Check .env not committed
        run: |
          if [ -f .env ]; then
            echo "❌ ERROR: .env file should not be committed!"
            exit 1
          else
            echo "✓ .env not in repository"
          fi

      # ── Python Dependency Audit ────────────────────────────────────
      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (Python CVE scan)
        run: |
          pip install -r requirements.txt
          pip-audit --strict --desc 2>&1 || echo "⚠ pip-audit found vulnerabilities — review above"

      # ── Frontend Dependency Audit ──────────────────────────────────
      - name: Run npm audit (Frontend CVE scan)
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high 2>&1 || echo "⚠ npm audit found vulnerabilities — review above"
