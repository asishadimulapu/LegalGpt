# =============================================================================
# CI Pipeline - LegalGpt
# Runs on every push and pull request
# Tests backend (Python) and builds frontend (Node.js)
# =============================================================================

name: CI - Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "18"

jobs:
  # ---------------------------------------------------------------------------
  # Backend Tests
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      # Dummy env vars so imports don't crash in CI
      DATABASE_URL: "sqlite:///./test.db"
      JWT_SECRET_KEY: "ci-test-secret-key-not-real"
      ENCRYPTION_KEY: "ci-test-encryption-key-1234567890abcdef"
      GROQ_API_KEY: "ci-test-groq-key"
      ENVIRONMENT: "testing"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run linting
        run: |
          pip install flake8
          # Stop build if there are syntax errors or undefined names
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings (non-blocking)
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check imports
        run: |
          python -c "from app.config import settings; print('✓ Config imports OK')"
          python -c "from app.core.embeddings import get_embeddings; print('✓ Embeddings import OK')"

  # ---------------------------------------------------------------------------
  # Frontend Build
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          test -f dist/index.html && echo "✓ index.html exists"
          test -d dist/assets && echo "✓ assets directory exists"
          echo "Build size:"
          du -sh dist/

  # ---------------------------------------------------------------------------
  # Security Check
  # ---------------------------------------------------------------------------
  security-check:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for secrets in code
        run: |
          # Check for common secret patterns (fail if found)
          echo "Scanning for exposed secrets..."
          ! grep -rn "GOCSPX-\|gsk_\|sk-\|AKIA" --include="*.py" --include="*.js" --include="*.jsx" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=venv \
            app/ frontend/src/ || echo "⚠ Potential secrets found - review above"

      - name: Check .env not committed
        run: |
          if [ -f .env ]; then
            echo "❌ ERROR: .env file should not be committed!"
            exit 1
          else
            echo "✓ .env not in repository"
          fi
