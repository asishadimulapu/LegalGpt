# =============================================================================
# CD Pipeline - NyayaSahay (LegalGpt)
# Auto-deploys to Azure VM on push to main using Docker
# =============================================================================

name: CD - Deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  VM_PROJECT_DIR: /home/azureuser/LegalGpt
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/asishadimulapu/legalgpt/backend
  FRONTEND_IMAGE: ghcr.io/asishadimulapu/legalgpt/frontend

jobs:
  # ---------------------------------------------------------------------------
  # Build & Push Docker Images to GitHub Container Registry
  # ---------------------------------------------------------------------------
  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to Production VM via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          # Strip Windows \r line endings that cause "error in libcrypto"
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Validate the key — fail fast if invalid
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "✗ SSH key invalid — check the SSH_PRIVATE_KEY secret"
            exit 1
          fi
          echo "✓ SSH key valid"
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy docker-compose to VM
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            docker-compose.yml \
            ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }}:${{ env.VM_PROJECT_DIR }}/docker-compose.yml

      - name: Ensure .env has production OAuth settings
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} << 'ENV_SCRIPT'
          cd /home/azureuser/LegalGpt

          # Ensure GOOGLE_REDIRECT_URI is HTTPS in the .env
          if grep -q 'GOOGLE_REDIRECT_URI=' .env 2>/dev/null; then
            sed -i 's|GOOGLE_REDIRECT_URI=http://.*|GOOGLE_REDIRECT_URI=https://law-gpt.app/auth/callback|' .env
          else
            echo 'GOOGLE_REDIRECT_URI=https://law-gpt.app/auth/callback' >> .env
          fi

          # Ensure APP_URL is HTTPS
          if grep -q 'APP_URL=' .env 2>/dev/null; then
            sed -i 's|APP_URL=http://localhost.*|APP_URL=https://law-gpt.app|' .env
          else
            echo 'APP_URL=https://law-gpt.app' >> .env
          fi

          echo "✓ .env production values verified"
          ENV_SCRIPT

      - name: Deploy to VM
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} << 'DEPLOY_SCRIPT'
          
          echo "=========================================="
          echo "🚀 Starting Docker deployment at $(date)"
          echo "=========================================="

          cd /home/azureuser/LegalGpt

          # 1. Login to GitHub Container Registry
          echo "🔑 Logging in to ghcr.io..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # 2. Pull latest images
          echo "📥 Pulling latest images..."
          docker compose pull backend frontend

          # 3. Restart services
          echo "🔄 Restarting services..."
          docker compose up -d --no-deps --remove-orphans backend frontend

          # 4. Wait for health checks
          echo "⏳ Waiting for services to start..."
          sleep 15

          # 5. Verify deployment
          echo "🔍 Verifying deployment..."
          curl -sf http://localhost:8000/health/live && echo "✓ Backend healthy" || echo "✗ Backend unhealthy"
          curl -sf http://localhost/health-ping && echo "✓ Frontend healthy" || echo "✗ Frontend unhealthy"

          # 6. Cleanup old images
          docker image prune -f

          echo "=========================================="
          echo "✅ Deployment completed at $(date)"
          echo "=========================================="
          DEPLOY_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed! Check the logs above."
