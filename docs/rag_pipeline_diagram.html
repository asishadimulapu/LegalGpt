<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Pipeline - LegalGPT Methodology</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    font-family: 'Segoe UI', 'Calibri', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px;
  }
  .pipeline {
    position: relative;
    width: 960px;
    height: 680px;
  }
  .step {
    position: absolute;
    background: linear-gradient(135deg, #d0dff0 0%, #b8cfe6 100%);
    border: 1.8px solid #7a9ec4;
    border-radius: 24px;
    padding: 13px 30px;
    font-size: 17px;
    font-weight: 500;
    color: #1a2a3a;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(100,130,170,0.13);
    letter-spacing: 0.2px;
  }
  /* Cascading positions — just like the presentation slide */
  .step-1 { top: 0;    left: 0; }
  .step-2 { top: 85px;  left: 90px; }
  .step-3 { top: 175px; left: 170px; }
  .step-4 { top: 265px; left: 240px; }
  .step-5 { top: 355px; left: 310px; }
  .step-6 { top: 445px; left: 370px; }
  .step-7 { top: 540px; left: 430px; font-weight: 600; }

  svg.arrows {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  svg.arrows path {
    fill: none;
    stroke: #5a8ab5;
    stroke-width: 2.2;
  }
  /* arrowhead on each connector */
  .arrow-tip {
    fill: #5a8ab5;
  }
</style>
</head>
<body>
<div class="pipeline">

  <!-- SVG curved arrows connecting every pair of steps -->
  <svg class="arrows" viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" class="arrow-tip"/>
      </marker>
    </defs>
    <!-- 1→2 -->
    <path d="M 80,40 C 80,62  100,70  105,82"  marker-end="url(#ah)"/>
    <!-- 2→3 -->
    <path d="M 205,125 C 205,148 185,155 190,172" marker-end="url(#ah)"/>
    <!-- 3→4 -->
    <path d="M 310,215 C 310,238 260,246 265,262" marker-end="url(#ah)"/>
    <!-- 4→5 -->
    <path d="M 420,305 C 420,328 335,338 340,352" marker-end="url(#ah)"/>
    <!-- 5→6 -->
    <path d="M 500,395 C 500,418 395,428 400,442" marker-end="url(#ah)"/>
    <!-- 6→7 -->
    <path d="M 560,485 C 560,510 455,520 460,537" marker-end="url(#ah)"/>
  </svg>

  <!-- Pipeline Steps — matched to YOUR actual codebase -->
  <div class="step step-1">User Query</div>
  <div class="step step-2">Query Enhancement Engine</div>
  <div class="step step-3">Sentence-Transformer Embedding</div>
  <div class="step step-4">FAISS Dense Vector Similarity Search</div>
  <div class="step step-5">Context Formatter + Source Extractor</div>
  <div class="step step-6">LLM Generator – Groq Llama 3.1 8B</div>
  <div class="step step-7">Answer + Legal Citation + Source References</div>
</div>
</body>
</html>
